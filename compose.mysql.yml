services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opencli_hub
      MYSQL_USER: opencli_hub
      MYSQL_PASSWORD: "${OPENCLI_HUB_MYSQL_PASSWORD:?OPENCLI_HUB_MYSQL_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
    volumes:
      - opencli-hub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  hub:
    build:
      context: .
      args:
        OPENCLI_HUB_DATABASE: mysql
      secrets:
        - opencli_extension_signing_key
    image: opencli-hub:local-mysql
    platform: linux/amd64
    user: "1000:1000"
    environment:
      # The MySQL variant (and its datasource configuration) is compiled into
      # the JAR; there is no runtime profile switch.
      OPENCLI_HUB_DATA_DIR: /data/opencli-hub
      OPENCLI_HUB_MYSQL_HOST: mysql
      OPENCLI_HUB_MYSQL_PORT: "3306"
      OPENCLI_HUB_MYSQL_DATABASE: opencli_hub
      OPENCLI_HUB_MYSQL_USERNAME: opencli_hub
      OPENCLI_HUB_MYSQL_PASSWORD: "${OPENCLI_HUB_MYSQL_PASSWORD:?OPENCLI_HUB_MYSQL_PASSWORD is required}"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${OPENCLI_HUB_BIND_ADDRESS:-127.0.0.1}:${OPENCLI_HUB_HOST_PORT:-8080}:8080"
    volumes:
      - opencli-hub-mysql-hub-data:/data/opencli-hub
      - opencli-hub-mysql-home:/var/lib/opencli
    shm_size: 2gb
    security_opt:
      - seccomp=unconfined
    stop_grace_period: 65s
    restart: unless-stopped

volumes:
  opencli-hub-mysql-data:
  opencli-hub-mysql-hub-data:
  opencli-hub-mysql-home:

secrets:
  opencli_extension_signing_key:
    file: "${OPENCLI_HUB_EXTENSION_SIGNING_KEY_FILE:-.secrets/opencli-extension-signing-key.pem}"
