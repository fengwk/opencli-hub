services:
  hub:
    build:
      context: .
      args:
        OPENCLI_HUB_DATABASE: sqlite
      secrets:
        - opencli_extension_signing_key
    image: opencli-hub:local-sqlite
    platform: linux/amd64
    user: "1000:1000"
    environment:
      # The SQLite variant (and its datasource configuration) is compiled into
      # the JAR; the database file defaults to
      # ${OPENCLI_HUB_DATA_DIR}/database/opencli-hub.db.
      OPENCLI_HUB_DATA_DIR: /data/opencli-hub
    ports:
      - "${OPENCLI_HUB_BIND_ADDRESS:-127.0.0.1}:${OPENCLI_HUB_HOST_PORT:-8080}:8080"
    volumes:
      - opencli-hub-sqlite-data:/data/opencli-hub
      # Explicit named home volume: Dockerfile VOLUME would otherwise create an
      # unreferenced anonymous volume and lose plugin/OpenCLI home state on
      # container recreation.
      - opencli-hub-sqlite-home:/var/lib/opencli
    shm_size: 2gb
    security_opt:
      - seccomp=unconfined
    stop_grace_period: 65s
    restart: unless-stopped

volumes:
  opencli-hub-sqlite-data:
  opencli-hub-sqlite-home:

secrets:
  opencli_extension_signing_key:
    file: "${OPENCLI_HUB_EXTENSION_SIGNING_KEY_FILE:-.secrets/opencli-extension-signing-key.pem}"
