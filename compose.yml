services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: opencli_hub
      MYSQL_USER: opencli_hub
      MYSQL_PASSWORD: ${OPENCLI_HUB_MYSQL_PASSWORD:-opencli_hub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-before-production}
    volumes:
      - opencli-hub-mysql-data:/var/lib/mysql
      - ./core/src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./core/src/main/resources/data-mysql.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  hub:
    build:
      context: .
    image: opencli-hub:local
    user: "1000:1000"
    environment:
      # No application-mysql.yml is needed: application.yml is the MySQL config.
      SPRING_PROFILES_ACTIVE: mysql
      OPENCLI_HUB_DATA_DIR: /data/opencli-hub
      OPENCLI_HUB_MYSQL_HOST: mysql
      OPENCLI_HUB_MYSQL_PORT: "3306"
      OPENCLI_HUB_MYSQL_DATABASE: opencli_hub
      OPENCLI_HUB_MYSQL_USERNAME: opencli_hub
      OPENCLI_HUB_MYSQL_PASSWORD: ${OPENCLI_HUB_MYSQL_PASSWORD:-opencli_hub}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - opencli-hub-mysql-hub-data:/data/opencli-hub
      - opencli-hub-mysql-home:/var/lib/opencli
    shm_size: 2gb
    security_opt:
      - seccomp=unconfined
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  opencli-hub-mysql-data:
  opencli-hub-mysql-hub-data:
  opencli-hub-mysql-home:
