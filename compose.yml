services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: opencli_hub
      POSTGRES_USER: opencli_hub
      POSTGRES_PASSWORD: "${OPENCLI_HUB_POSTGRESQL_PASSWORD:?OPENCLI_HUB_POSTGRESQL_PASSWORD is required}"
    volumes:
      - opencli-hub-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencli_hub -d opencli_hub"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  hub:
    build:
      context: .
      args:
        OPENCLI_HUB_DATABASE: postgresql
      secrets:
        - opencli_extension_signing_key
    image: opencli-hub:local-postgresql
    platform: linux/amd64
    user: "1000:1000"
    environment:
      # The PostgreSQL variant (and its datasource configuration) is compiled
      # into the JAR; there is no runtime profile switch.
      OPENCLI_HUB_DATA_DIR: /data/opencli-hub
      OPENCLI_HUB_POSTGRESQL_HOST: postgresql
      OPENCLI_HUB_POSTGRESQL_PORT: "5432"
      OPENCLI_HUB_POSTGRESQL_DATABASE: opencli_hub
      OPENCLI_HUB_POSTGRESQL_USERNAME: opencli_hub
      OPENCLI_HUB_POSTGRESQL_PASSWORD: "${OPENCLI_HUB_POSTGRESQL_PASSWORD:?OPENCLI_HUB_POSTGRESQL_PASSWORD is required}"
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "${OPENCLI_HUB_BIND_ADDRESS:-127.0.0.1}:${OPENCLI_HUB_HOST_PORT:-8080}:8080"
    volumes:
      - opencli-hub-postgresql-hub-data:/data/opencli-hub
      - opencli-hub-postgresql-home:/var/lib/opencli
    shm_size: 2gb
    security_opt:
      - seccomp=unconfined
    stop_grace_period: 65s
    restart: unless-stopped

volumes:
  opencli-hub-postgresql-data:
  opencli-hub-postgresql-hub-data:
  opencli-hub-postgresql-home:

secrets:
  opencli_extension_signing_key:
    file: "${OPENCLI_HUB_EXTENSION_SIGNING_KEY_FILE:-.secrets/opencli-extension-signing-key.pem}"
