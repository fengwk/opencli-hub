spring:
  application:
    name: opencli-hub-core-test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:opencli-hub-core-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: SA
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  cloud:
    nacos:
      config:
        enabled: false

mybatis:
  mapper-locations: classpath*:**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

convention:
  snowflake-id:
    initial-timestamp: 1702214261706
    worker-id: 0

opencli:
  hub:
    data-dir: ${java.io.tmpdir}/opencli-hub-core-test
    opencli:
      workdir: ${java.io.tmpdir}
    resource:
      root-dir: ${java.io.tmpdir}/opencli-hub-core-test/resources
