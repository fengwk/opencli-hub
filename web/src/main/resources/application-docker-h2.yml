spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${OPENCLI_HUB_DATA_DIR:/data/opencli-hub}/database/opencli-hub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE
    username: SA
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
