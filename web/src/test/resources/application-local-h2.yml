spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:opencli-hub-local;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: SA
    password:
  sql:
    init:
      # Never run DDL in the web full-context test: the core schema lives in core test
      # resources (not on the web test classpath) and this profile only boots the context
      # with a datasource; no repository is exercised here.
      mode: never

logging:
  file:
    path: ${java.io.tmpdir}/opencli-hub-local/logs

opencli:
  hub:
    data-dir: ${java.io.tmpdir}/opencli-hub-local
    opencli:
      workdir: ${java.io.tmpdir}
    runtime:
      # No schema means no instance rows to recover; keep the boot sweep off the database.
      startup-recovery-enabled: false
    resource:
      root-dir: ${java.io.tmpdir}/opencli-hub-local/resources
